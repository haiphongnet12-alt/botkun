<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEON TÀI XỈU</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --cyan:#00eaff;
    --blue:#3978ff;
    --purple:#9d4dff;
    --pink:#ff36c7;
    --red:#ff315b;
    --green:#23ff9b;
    --dark:#05030d;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    overflow-x:hidden;
    color:#fff;
    font-family:'Be Vietnam Pro',sans-serif;
    background:
        radial-gradient(circle at 50% 40%,#17103b 0,#08051a 35%,#03020a 75%);
}

/* ================= BACKGROUND ================= */

.bg-grid{
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;
    perspective:700px;
}

.grid-floor{
    position:absolute;
    width:160%;
    height:70%;
    left:-30%;
    bottom:-18%;
    transform:rotateX(65deg);
    transform-origin:center bottom;
    background-image:
        linear-gradient(rgba(0,234,255,.09) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,234,255,.09) 1px,transparent 1px);
    background-size:65px 65px;
    mask-image:linear-gradient(to top,black,transparent);
    animation:gridMove 5s linear infinite;
}

@keyframes gridMove{
    to{
        background-position:0 65px;
    }
}

.nebula{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:.35;
}

.nebula.one{
    width:400px;
    height:400px;
    background:#5e1aff;
    top:-100px;
    left:-100px;
}

.nebula.two{
    width:350px;
    height:350px;
    background:#ff168d;
    right:-100px;
    top:25%;
}

.nebula.three{
    width:450px;
    height:450px;
    background:#005eff;
    bottom:-220px;
    left:30%;
}

.stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-5;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 8px #fff;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.15}
    to{opacity:1}
}

/* ================= TOP ================= */

header{
    height:76px;
    position:fixed;
    z-index:100;
    top:0;
    left:0;
    right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 35px;
    background:rgba(3,2,10,.58);
    border-bottom:1px solid rgba(0,234,255,.12);
    backdrop-filter:blur(18px);
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.brand-icon{
    width:42px;
    height:42px;
    display:grid;
    place-items:center;
    border-radius:12px;
    font-size:20px;
    color:#fff;
    border:1px solid rgba(0,234,255,.6);
    background:
        linear-gradient(135deg,
        rgba(0,234,255,.2),
        rgba(157,77,255,.2));
    box-shadow:
        0 0 20px rgba(0,234,255,.2),
        inset 0 0 15px rgba(157,77,255,.1);
}

.brand h2{
    font-family:Orbitron,sans-serif;
    font-size:16px;
    letter-spacing:3px;
}

.brand span{
    display:block;
    color:rgba(255,255,255,.4);
    font-size:8px;
    letter-spacing:4px;
    margin-top:3px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:9px;
}

.header-btn{
    height:38px;
    padding:0 14px;
    color:#fff;
    border:1px solid rgba(0,234,255,.18);
    border-radius:10px;
    background:rgba(255,255,255,.035);
    cursor:pointer;
    transition:.25s;
}

.header-btn:hover{
    border-color:var(--cyan);
    color:var(--cyan);
    box-shadow:0 0 18px rgba(0,234,255,.15);
}

/* ================= MAIN ================= */

main{
    min-height:100vh;
    padding-top:76px;
}

.wrapper{
    width:min(1500px,100%);
    min-height:calc(100vh - 76px);
    margin:auto;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px 20px 60px;
}

/* ================= TITLE ================= */

.heading{
    text-align:center;
    position:relative;
    z-index:5;
    margin-bottom:15px;
}

.heading .mini{
    color:var(--cyan);
    font-family:Orbitron,sans-serif;
    font-size:9px;
    letter-spacing:6px;
    text-shadow:0 0 15px var(--cyan);
}

.heading h1{
    font-family:Orbitron,sans-serif;
    font-size:clamp(32px,5vw,65px);
    letter-spacing:8px;
    margin-top:8px;
    text-shadow:
        0 0 10px rgba(255,255,255,.3),
        0 0 35px rgba(157,77,255,.55);
}

.heading h1 span{
    color:var(--cyan);
}

.heading p{
    color:rgba(255,255,255,.38);
    font-size:10px;
    letter-spacing:3px;
    margin-top:7px;
}

/* ================= GAME ================= */

.game{
    width:min(1000px,95vw);
    height:590px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* energy ring */

.energy{
    position:absolute;
    width:650px;
    height:650px;
    border-radius:50%;
    border:1px solid rgba(0,234,255,.08);
    box-shadow:
        0 0 50px rgba(0,234,255,.05),
        inset 0 0 50px rgba(157,77,255,.05);
}

.energy:before,
.energy:after{
    content:"";
    position:absolute;
    inset:35px;
    border-radius:50%;
    border:1px dashed rgba(157,77,255,.14);
}

.energy:after{
    inset:75px;
    border-style:solid;
    border-color:rgba(0,234,255,.08);
}

.energy.spin{
    animation:energySpin 10s linear infinite;
}

@keyframes energySpin{
    to{
        transform:rotate(360deg);
    }
}

/* table */

.table{
    position:absolute;
    width:850px;
    height:410px;
    border-radius:50%;
    background:
        radial-gradient(ellipse,
        rgba(20,11,57,.96),
        rgba(7,5,24,.98) 62%,
        rgba(2,1,8,.98));
    border:2px solid rgba(0,234,255,.35);
    box-shadow:
        0 0 20px rgba(0,234,255,.15),
        0 0 80px rgba(157,77,255,.1),
        inset 0 0 80px rgba(0,234,255,.05),
        0 40px 80px rgba(0,0,0,.7);
    transform:perspective(1000px) rotateX(55deg);
}

.table:before{
    content:"";
    position:absolute;
    inset:20px;
    border-radius:50%;
    border:1px solid rgba(0,234,255,.16);
}

.table:after{
    content:"";
    position:absolute;
    inset:45px;
    border-radius:50%;
    border:1px solid rgba(157,77,255,.1);
}

/* ================= PLATFORM ================= */

.platform{
    position:absolute;
    width:490px;
    height:230px;
    border-radius:50%;
    top:52%;
    left:50%;
    transform:translate(-50%,-50%) rotateX(58deg);
    background:
        radial-gradient(ellipse,
        #111426,
        #070913 65%,
        #020308);
    border:2px solid rgba(0,234,255,.65);
    box-shadow:
        0 0 25px rgba(0,234,255,.18),
        0 0 70px rgba(157,77,255,.12),
        inset 0 0 40px #000;
    z-index:4;
}

.platform:before{
    content:"";
    position:absolute;
    inset:14px;
    border-radius:50%;
    border:1px solid rgba(0,234,255,.5);
    box-shadow:0 0 20px rgba(0,234,255,.1);
}

.platform:after{
    content:"";
    position:absolute;
    inset:34px;
    border-radius:50%;
    border:1px dashed rgba(157,77,255,.45);
    animation:platformSpin 8s linear infinite;
}

@keyframes platformSpin{
    to{transform:rotate(360deg)}
}

/* ================= DICE ================= */

.dice-box{
    position:absolute;
    z-index:15;
    left:50%;
    top:49%;
    transform:translate(-50%,-50%);
    width:300px;
    height:140px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    perspective:1000px;
}

.die{
    position:relative;
    width:72px;
    height:72px;
    border-radius:13px;
    background:
        linear-gradient(145deg,#fff,#dce5ed 45%,#7e8d9d);
    border:1px solid rgba(255,255,255,.8);
    box-shadow:
        0 12px 25px rgba(0,0,0,.7),
        0 0 12px rgba(0,234,255,.2),
        inset 3px 3px 8px #fff,
        inset -5px -6px 10px rgba(0,0,0,.25);
    transform-style:preserve-3d;
}

.die.rolling{
    animation:dieRoll .55s linear infinite;
}

@keyframes dieRoll{
    0%{
        transform:translateY(0) rotate(0deg) rotateX(0);
    }
    25%{
        transform:translateY(-28px) rotate(90deg) rotateX(70deg);
    }
    50%{
        transform:translateY(4px) rotate(180deg) rotateX(150deg);
    }
    75%{
        transform:translateY(-20px) rotate(270deg) rotateX(230deg);
    }
    100%{
        transform:translateY(0) rotate(360deg) rotateX(360deg);
    }
}

.pip{
    position:absolute;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#161a20;
    box-shadow:
        inset 2px 2px 3px rgba(255,255,255,.08),
        0 1px 1px rgba(0,0,0,.3);
}

.a{top:10px;left:10px}
.b{top:10px;left:50%;transform:translateX(-50%)}
.c{top:10px;right:10px}
.d{top:50%;left:10px;transform:translateY(-50%)}
.e{top:50%;left:50%;transform:translate(-50%,-50%)}
.f{top:50%;right:10px;transform:translateY(-50%)}
.g{bottom:10px;left:10px}
.h{bottom:10px;left:50%;transform:translateX(-50%)}
.i{bottom:10px;right:10px}

/* ================= BOWL ================= */

.bowl-wrap{
    position:absolute;
    z-index:30;
    width:430px;
    height:280px;
    left:50%;
    top:47%;
    transform:translate(-50%,-50%);
    transition:
        top .7s cubic-bezier(.2,.9,.3,1),
        transform .7s cubic-bezier(.2,.9,.3,1);
}

.bowl{
    position:absolute;
    width:430px;
    height:250px;
    top:10px;
    left:0;
    border-radius:50%;
    transform:rotateX(58deg);
    background:
        radial-gradient(
            ellipse at 32% 18%,
            #dfffff,
            #24cde5 8%,
            #2566a8 28%,
            #13194c 55%,
            #060517 80%
        );
    border:3px solid rgba(0,234,255,.85);
    box-shadow:
        0 35px 40px rgba(0,0,0,.75),
        0 0 30px rgba(0,234,255,.35),
        0 0 70px rgba(157,77,255,.25),
        inset 0 5px 8px rgba(255,255,255,.5),
        inset 0 -30px 40px rgba(0,0,0,.65);
    transition:.4s;
}

.bowl:before{
    content:"";
    position:absolute;
    inset:17px;
    border-radius:50%;
    border:2px solid rgba(0,234,255,.8);
    box-shadow:
        inset 0 0 20px rgba(0,234,255,.2),
        0 0 20px rgba(0,234,255,.12);
}

.bowl:after{
    content:"";
    position:absolute;
    width:170px;
    height:65px;
    left:85px;
    top:30px;
    border-radius:50%;
    background:linear-gradient(
        130deg,
        rgba(255,255,255,.6),
        transparent 65%
    );
    filter:blur(5px);
}

.bowl-logo{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-family:Orbitron,sans-serif;
    font-size:42px;
    font-weight:900;
    color:#dfffff;
    text-shadow:
        0 0 8px #00eaff,
        0 0 25px #00eaff;
}

.handle{
    position:absolute;
    width:105px;
    height:30px;
    left:50%;
    top:-12px;
    transform:translateX(-50%);
    border-radius:50%;
    border:2px solid var(--cyan);
    background:#091833;
    box-shadow:
        0 0 15px var(--cyan),
        inset 0 0 10px rgba(0,234,255,.4);
}

/* bowl shake */

.bowl.shake{
    animation:bowlShake .09s infinite alternate;
}

@keyframes bowlShake{
    0%{
        transform:
            translateX(-8px)
            rotateX(58deg)
            rotateZ(-1deg);
    }
    100%{
        transform:
            translateX(8px)
            rotateX(58deg)
            rotateZ(1deg);
    }
}

.bowl.open{
    top:-110px;
    transform:
        translateX(-50%)
        rotateX(58deg)
        scale(.8);
    opacity:.1;
}

/* ================= STATUS ================= */

.status{
    position:absolute;
    z-index:40;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    min-width:290px;
    padding:10px 20px;
    text-align:center;
    border-radius:30px;
    border:1px solid rgba(0,234,255,.2);
    background:rgba(3,2,15,.55);
    backdrop-filter:blur(12px);
    font-family:Orbitron,sans-serif;
    font-size:9px;
    letter-spacing:3px;
    color:rgba(255,255,255,.5);
    box-shadow:0 0 20px rgba(0,234,255,.05);
}

.status.active{
    color:var(--cyan);
    border-color:rgba(0,234,255,.6);
    box-shadow:
        0 0 20px rgba(0,234,255,.15),
        inset 0 0 15px rgba(0,234,255,.05);
}

/* ================= RESULT ================= */

.result{
    position:absolute;
    z-index:50;
    left:50%;
    top:72%;
    transform:translate(-50%,-50%) scale(.3);
    opacity:0;
    text-align:center;
    pointer-events:none;
    transition:.55s cubic-bezier(.15,1.5,.3,1);
}

.result.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

.result-small{
    font-family:Orbitron,sans-serif;
    font-size:9px;
    letter-spacing:5px;
    color:rgba(255,255,255,.45);
}

.result-word{
    font-family:Orbitron,sans-serif;
    font-size:65px;
    line-height:1.1;
    font-weight:900;
    letter-spacing:5px;
}

.result-word.tai{
    color:var(--red);
    text-shadow:
        0 0 10px var(--red),
        0 0 35px rgba(255,49,91,.7);
}

.result-word.xiu{
    color:var(--cyan);
    text-shadow:
        0 0 10px var(--cyan),
        0 0 35px rgba(0,234,255,.7);
}

.result-total{
    font-family:Orbitron,sans-serif;
    font-size:10px;
    color:#fff;
    letter-spacing:3px;
}

/* ================= BUTTON ================= */

.controls{
    position:relative;
    z-index:60;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:11px;
    margin-top:-10px;
}

.roll{
    width:285px;
    height:62px;
    border-radius:13px;
    border:1px solid rgba(0,234,255,.7);
    background:
        linear-gradient(
            100deg,
            #07192a,
            #10134b,
            #24134d
        );
    color:#fff;
    font-family:Orbitron,sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:2px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    box-shadow:
        0 0 20px rgba(0,234,255,.15),
        inset 0 0 20px rgba(0,234,255,.06);
    transition:.25s;
}

.roll:before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    width:80px;
    left:-100px;
    transform:skewX(-20deg);
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.4),
        transparent
    );
    animation:buttonLight 2.4s infinite;
}

@keyframes buttonLight{
    0%{left:-120px}
    45%,100%{left:400px}
}

.roll:hover{
    border-color:#fff;
    box-shadow:
        0 0 30px rgba(0,234,255,.3),
        0 0 60px rgba(157,77,255,.15);
    transform:translateY(-3px);
}

.roll:active{
    transform:translateY(1px);
}

.roll:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.hint{
    font-size:8px;
    color:rgba(255,255,255,.25);
    font-family:Orbitron,sans-serif;
    letter-spacing:2px;
}

/* ================= SIDE HUD ================= */

.hud{
    position:absolute;
    z-index:70;
    width:210px;
    border:1px solid rgba(0,234,255,.15);
    background:rgba(5,3,18,.5);
    backdrop-filter:blur(15px);
    border-radius:14px;
    overflow:hidden;
}

.hud.left{
    left:20px;
    top:150px;
}

.hud.right{
    right:20px;
    top:150px;
}

.hud-title{
    padding:13px;
    font-family:Orbitron,sans-serif;
    font-size:8px;
    letter-spacing:3px;
    color:var(--cyan);
    border-bottom:1px solid rgba(0,234,255,.1);
}

.hud-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 13px;
    border-bottom:1px solid rgba(255,255,255,.04);
}

.hud-row:last-child{
    border:0;
}

.hud-row span:first-child{
    color:rgba(255,255,255,.35);
    font-size:9px;
}

.hud-row span:last-child{
    font-family:Orbitron,sans-serif;
    font-size:10px;
}

.history-list{
    max-height:270px;
    overflow-y:auto;
}

.history-item{
    padding:9px 11px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:5px;
    border-bottom:1px solid rgba(255,255,255,.04);
}

.history-dice{
    font-size:9px;
    color:rgba(255,255,255,.4);
}

.history-type{
    font-family:Orbitron,sans-serif;
    font-size:8px;
}

.history-type.tai{
    color:var(--red);
}

.history-type.xiu{
    color:var(--cyan);
}

/* ================= PARTICLES ================= */

.particle{
    position:fixed;
    z-index:200;
    width:4px;
    height:4px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:
        0 0 8px var(--cyan),
        0 0 18px var(--cyan);
    pointer-events:none;
    animation:particle .9s cubic-bezier(.1,.8,.2,1) forwards;
}

@keyframes particle{
    to{
        transform:
            translate(var(--x),var(--y))
            scale(0);
        opacity:0;
    }
}

/* ================= FLASH ================= */

.flash{
    position:fixed;
    inset:0;
    z-index:150;
    pointer-events:none;
    opacity:0;
    background:
        radial-gradient(
            circle at center,
            rgba(0,234,255,.25),
            transparent 40%
        );
}

.flash.active{
    animation:flash .5s ease-out;
}

@keyframes flash{
    0%{opacity:0}
    25%{opacity:1}
    100%{opacity:0}
}

/* ================= AUTO ================= */

.auto{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    display:flex;
    align-items:center;
    gap:9px;
    padding:8px 13px;
    border-radius:30px;
    background:rgba(5,3,15,.6);
    border:1px solid rgba(0,234,255,.12);
    backdrop-filter:blur(12px);
    font-family:Orbitron,sans-serif;
    font-size:8px;
    letter-spacing:2px;
}

.switch{
    width:34px;
    height:18px;
    padding:2px;
    border-radius:20px;
    background:#20202b;
    cursor:pointer;
    transition:.3s;
}

.switch i{
    display:block;
    width:14px;
    height:14px;
    border-radius:50%;
    background:#666;
    transition:.3s;
}

.switch.on{
    background:#005e78;
    box-shadow:0 0 12px rgba(0,234,255,.35);
}

.switch.on i{
    transform:translateX(16px);
    background:var(--cyan);
    box-shadow:0 0 8px var(--cyan);
}

/* ================= MOBILE ================= */

@media(max-width:1100px){

    .hud{
        display:none;
    }

    .table{
        width:90vw;
    }
}

@media(max-width:650px){

    header{
        height:65px;
        padding:0 14px;
    }

    main{
        padding-top:65px;
    }

    .brand h2{
        font-size:12px;
    }

    .brand span{
        display:none;
    }

    .header-btn{
        padding:0 9px;
        font-size:10px;
    }

    .heading h1{
        font-size:34px;
        letter-spacing:5px;
    }

    .heading .mini{
        font-size:7px;
        letter-spacing:4px;
    }

    .game{
        height:490px;
        width:100vw;
    }

    .energy{
        width:420px;
        height:420px;
    }

    .table{
        width:120vw;
        height:300px;
    }

    .platform{
        width:340px;
        height:165px;
    }

    .bowl-wrap{
        width:315px;
        height:220px;
    }

    .bowl{
        width:315px;
        height:200px;
    }

    .bowl-logo{
        font-size:30px;
    }

    .handle{
        width:85px;
    }

    .dice-box{
        width:230px;
        gap:8px;
    }

    .die{
        width:58px;
        height:58px;
    }

    .pip{
        width:9px;
        height:9px;
    }

    .a,.b,.c{top:8px}
    .a,.d,.g{left:8px}
    .c,.f,.i{right:8px}
    .g,.h,.i{bottom:8px}

    .result-word{
        font-size:48px;
    }

    .result{
        top:75%;
    }

    .roll{
        width:250px;
    }

    .status{
        min-width:230px;
        font-size:7px;
    }
}
</style>
</head>

<body>

<div class="bg-grid">
    <div class="nebula one"></div>
    <div class="nebula two"></div>
    <div class="nebula three"></div>
    <div class="grid-floor"></div>
</div>

<div class="stars" id="stars"></div>
<div class="flash" id="flash"></div>

<header>

    <div class="brand">

        <div class="brand-icon">◈</div>

        <div>
            <h2>NEON TÀI XỈU</h2>
            <span>QUANTUM DICE SYSTEM</span>
        </div>

    </div>

    <div class="header-right">

        <button class="header-btn" id="soundBtn">
            🔊
        </button>

        <button class="header-btn" id="resetBtn">
            ↻ RESET
        </button>

    </div>

</header>

<main>

<div class="wrapper">

    <div class="heading">

        <div class="mini">
            QUANTUM GAMING SYSTEM
        </div>

        <h1>
            TÀI <span>×</span> XỈU
        </h1>

        <p>
            ENTER THE DICE DIMENSION
        </p>

    </div>

    <!-- LEFT HUD -->

    <div class="hud left">

        <div class="hud-title">
            SYSTEM STATUS
        </div>

        <div class="hud-row">
            <span>PHIÊN</span>
            <span id="round">000</span>
        </div>

        <div class="hud-row">
            <span>TÀI</span>
            <span id="tai">000</span>
        </div>

        <div class="hud-row">
            <span>XỈU</span>
            <span id="xiu">000</span>
        </div>

        <div class="hud-row">
            <span>LAST</span>
            <span id="last">---</span>
        </div>

    </div>

    <!-- RIGHT HUD -->

    <div class="hud right">

        <div class="hud-title">
            RECENT DATA
        </div>

        <div
            class="history-list"
            id="history"
        ></div>

    </div>

    <div class="game">

        <div class="energy spin"></div>

        <div class="table"></div>

        <div class="status" id="status">
            SYSTEM READY • CLICK TO START
        </div>

        <div class="platform"></div>

        <div
            class="dice-box"
            id="diceBox"
        ></div>

        <div
            class="bowl-wrap"
            id="bowlWrap"
        >

            <div
                class="bowl"
                id="bowl"
            >

                <div class="bowl-logo">
                    N X
                </div>

                <div class="handle"></div>

            </div>

        </div>

        <div
            class="result"
            id="result"
        >

            <div class="result-small">
                FINAL RESULT
            </div>

            <div
                class="result-word"
                id="resultWord"
            >
                TÀI
            </div>

            <div
                class="result-total"
                id="resultTotal"
            >
                TOTAL 12
            </div>

        </div>

    </div>

    <div class="controls">

        <button
            class="roll"
            id="rollBtn"
        >
            ◈  XÓC BÁT &nbsp; / &nbsp; XEM KẾT QUẢ
        </button>

        <div class="hint">
            QUANTUM DICE • RANDOM SESSION
        </div>

    </div>

</div>

</main>

<div class="auto">

    AUTO MODE

    <div
        class="switch"
        id="autoSwitch"
    >
        <i></i>
    </div>

</div>

<script>

/* ================= STAR FIELD ================= */

const stars = document.getElementById("stars");

for(let i=0;i<100;i++){

    const star = document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random()*100+"%";

    star.style.top =
        Math.random()*100+"%";

    star.style.animationDelay =
        Math.random()*2+"s";

    star.style.opacity =
        Math.random();

    stars.appendChild(star);
}


/* ================= ELEMENTS ================= */

const rollBtn =
    document.getElementById("rollBtn");

const bowl =
    document.getElementById("bowl");

const diceBox =
    document.getElementById("diceBox");

const result =
    document.getElementById("result");

const resultWord =
    document.getElementById("resultWord");

const resultTotal =
    document.getElementById("resultTotal");

const status =
    document.getElementById("status");

const flash =
    document.getElementById("flash");

const historyBox =
    document.getElementById("history");

const roundEl =
    document.getElementById("round");

const taiEl =
    document.getElementById("tai");

const xiuEl =
    document.getElementById("xiu");

const lastEl =
    document.getElementById("last");


/* ================= STATE ================= */

let history =
    JSON.parse(
        localStorage.getItem("neon_taixiu")
        || "[]"
    );

let busy = false;
let sound = true;
let auto = false;
let autoTimer = null;


/* ================= DICE ================= */

function createDie(value){

    const die =
        document.createElement("div");

    die.className = "die";

    const positions = {

        1:["e"],

        2:["a","i"],

        3:["a","e","i"],

        4:["a","c","g","i"],

        5:["a","c","e","g","i"],

        6:["a","c","d","f","g","i"]

    };

    positions[value].forEach(pos=>{

        const pip =
            document.createElement("span");

        pip.className =
            "pip "+pos;

        die.appendChild(pip);

    });

    return die;
}


function setDice(values){

    diceBox.innerHTML = "";

    values.forEach(value=>{

        const die =
            createDie(value);

        die.dataset.value =
            value;

        diceBox.appendChild(die);

    });

}


/* ================= RANDOM ================= */

function randomDice(){

    return [

        Math.floor(Math.random()*6)+1,

        Math.floor(Math.random()*6)+1,

        Math.floor(Math.random()*6)+1

    ];

}


/* ================= AUDIO ================= */

let audio = null;

function initAudio(){

    if(!sound) return;

    if(!audio){

        audio =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(audio.state==="suspended"){
        audio.resume();
    }

}


function beep(
    frequency,
    duration=.1,
    type="sine",
    volume=.035
){

    if(!sound) return;

    initAudio();

    const osc =
        audio.createOscillator();

    const gain =
        audio.createGain();

    osc.type = type;

    osc.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime+duration
    );

    osc.connect(gain);

    gain.connect(
        audio.destination
    );

    osc.start();

    osc.stop(
        audio.currentTime+duration
    );

}


/* ================= PARTICLES ================= */

function particles(){

    const cx =
        window.innerWidth/2;

    const cy =
        window.innerHeight*.53;

    for(let i=0;i<65;i++){

        const p =
            document.createElement("div");

        p.className =
            "particle";

        p.style.left =
            cx+"px";

        p.style.top =
            cy+"px";

        const angle =
            Math.random()*Math.PI*2;

        const distance =
            100+Math.random()*300;

        p.style.setProperty(
            "--x",
            Math.cos(angle)*distance+"px"
        );

        p.style.setProperty(
            "--y",
            Math.sin(angle)*distance+"px"
        );

        if(Math.random()>.5){

            p.style.background =
                "#9d4dff";

            p.style.boxShadow =
                "0 0 8px #9d4dff";

        }

        document.body.appendChild(p);

        setTimeout(
            ()=>p.remove(),
            1000
        );

    }

}


/* ================= HISTORY ================= */

function save(data){

    history.unshift(data);

    history =
        history.slice(0,50);

    localStorage.setItem(
        "neon_taixiu",
        JSON.stringify(history)
    );

}


function render(){

    const tai =
        history.filter(
            x=>x.type==="TÀI"
        ).length;

    const xiu =
        history.filter(
            x=>x.type==="XỈU"
        ).length;

    roundEl.textContent =
        String(history.length)
        .padStart(3,"0");

    taiEl.textContent =
        String(tai)
        .padStart(3,"0");

    xiuEl.textContent =
        String(xiu)
        .padStart(3,"0");

    lastEl.textContent =
        history.length
        ? history[0].total
        : "---";


    if(!history.length){

        historyBox.innerHTML = `
            <div style="
                padding:20px;
                text-align:center;
                font-size:8px;
                color:#ffffff44;
                font-family:Orbitron
            ">
                NO DATA
            </div>
        `;

        return;
    }


    historyBox.innerHTML =
        history
        .slice(0,12)
        .map((item,index)=>`

            <div class="history-item">

                <div class="history-dice">
                    ${item.dice.join(" • ")}
                </div>

                <div class="
                    history-type
                    ${item.type==="TÀI"
                        ?"tai"
                        :"xiu"}
                ">
                    ${item.type}
                    ${item.total}
                </div>

            </div>

        `)
        .join("");

}


/* ================= WAIT ================= */

function wait(ms){

    return new Promise(
        resolve=>setTimeout(resolve,ms)
    );

}


/* ================= ROLL ================= */

async function roll(){

    if(busy) return;

    busy = true;

    rollBtn.disabled = true;

    initAudio();

    result.classList.remove("show");

    const values =
        randomDice();

    setDice(values);

    const dice =
        [...document.querySelectorAll(".die")];

    status.classList.add("active");

    status.textContent =
        "INITIALIZING QUANTUM DICE...";

    beep(250,.12,"sine");

    await wait(500);


    status.textContent =
        "BOWL LOCKED • STARTING...";

    beep(180,.1,"square");

    await wait(500);


    /* shake */

    status.textContent =
        "ROLLING THE DICE...";

    bowl.classList.add("shake");

    dice.forEach(
        die=>die.classList.add("rolling")
    );


    for(let i=0;i<18;i++){

        beep(
            70+Math.random()*40,
            .06,
            "square",
            .018
        );

        await wait(90);

    }


    bowl.classList.remove("shake");

    dice.forEach(
        die=>die.classList.remove("rolling")
    );


    await wait(400);


    /* open */

    status.textContent =
        "ACCESSING RESULT...";

    bowl.classList.add("open");

    beep(480,.12,"sine");

    await wait(450);


    const total =
        values[0]+values[1]+values[2];

    const type =
        total>=11
        ? "TÀI"
        : "XỈU";


    resultWord.textContent =
        type;

    resultWord.className =
        "result-word "+
        (type==="TÀI"
            ?"tai"
            :"xiu");


    resultTotal.textContent =
        `TOTAL ${total} • ${values.join(" / ")}`;


    result.classList.add("show");

    flash.classList.add("active");

    particles();

    beep(500,.15,"sine",.05);

    setTimeout(
        ()=>beep(750,.2,"sine",.045),
        100
    );

    setTimeout(
        ()=>beep(1000,.25,"sine",.04),
        220
    );


    save({
        dice:values,
        total:total,
        type:type,
        time:Date.now()
    });

    render();


    await wait(2200);


    result.classList.remove("show");

    bowl.classList.remove("open");

    status.textContent =
        "SYSTEM READY • NEXT ROUND";


    await wait(650);


    rollBtn.disabled = false;

    busy = false;


    if(auto){

        autoTimer =
            setTimeout(
                roll,
                1500
            );

    }

}


/* ================= BUTTON ================= */

rollBtn.addEventListener(
    "click",
    roll
);


/* ================= SOUND ================= */

document.getElementById("soundBtn")
.addEventListener("click",function(){

    sound = !sound;

    this.textContent =
        sound ? "🔊" : "🔇";

    if(sound){

        initAudio();

        beep(600,.1);

    }

});


/* ================= RESET ================= */

document.getElementById("resetBtn")
.addEventListener("click",()=>{

    if(busy) return;

    if(
        confirm(
            "Bạn muốn xóa toàn bộ lịch sử?"
        )
    ){

        history = [];

        localStorage.removeItem(
            "neon_taixiu"
        );

        render();

    }

});


/* ================= AUTO ================= */

document.getElementById("autoSwitch")
.addEventListener(
    "click",
    function(){

        auto =
            !auto;

        this.classList.toggle(
            "on",
            auto
        );

        if(auto && !busy){

            roll();

        }

        if(!auto && autoTimer){

            clearTimeout(
                autoTimer
            );

            autoTimer = null;

        }

    }
);


/* ================= INIT ================= */

setDice([2,5,3]);

render();

document.addEventListener(
    "pointerdown",
    ()=>{
        if(sound){
            initAudio();
        }
    },
    {once:true}
);

</script>

</body>
</html>
