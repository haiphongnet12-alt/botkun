<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TÀI XỈU • Casino</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --gold:#ffd76a;
    --gold2:#ffb82e;
    --green:#07582f;
    --green2:#063b22;
    --red:#ff4141;
    --blue:#399bff;
    --white:#fff;
}

html,body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    font-family:'Be Vietnam Pro',sans-serif;
    color:#fff;
    background:#03170e;
}

/* ================= BACKGROUND ================= */

body:before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-5;
    background:
        radial-gradient(circle at 50% 35%,rgba(27,151,82,.28),transparent 28%),
        radial-gradient(circle at 15% 80%,rgba(255,188,45,.08),transparent 25%),
        radial-gradient(circle at 85% 20%,rgba(255,214,93,.08),transparent 25%),
        linear-gradient(145deg,#02130b,#052e1b 45%,#02150d);
}

body:after{
    content:"";
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
    background:radial-gradient(circle,transparent 45%,rgba(0,0,0,.6) 100%);
}

/* ================= TOP ================= */

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:76px;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 35px;
    background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.05));
    backdrop-filter:blur(8px);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-mark{
    width:44px;
    height:44px;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:23px;
    background:
        radial-gradient(circle at 35% 30%,#fff1a5,#ffd24e 40%,#bd7111 75%);
    color:#5b3100;
    box-shadow:
        0 0 20px rgba(255,196,50,.3),
        inset 0 2px 3px #fff;
}

.logo-text strong{
    display:block;
    font-size:16px;
    letter-spacing:2px;
}

.logo-text span{
    font-size:10px;
    opacity:.5;
    letter-spacing:3px;
}

.top-actions{
    display:flex;
    gap:10px;
}

.top-btn{
    border:1px solid rgba(255,215,106,.2);
    background:rgba(255,255,255,.05);
    color:#fff;
    border-radius:12px;
    height:40px;
    padding:0 15px;
    cursor:pointer;
    transition:.25s;
}

.top-btn:hover{
    background:rgba(255,215,106,.12);
    border-color:rgba(255,215,106,.6);
}

/* ================= MAIN ================= */

.main{
    min-height:100vh;
    padding-top:76px;
    display:flex;
    justify-content:center;
    position:relative;
}

.casino{
    width:min(1400px,100%);
    min-height:calc(100vh - 76px);
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px 20px 70px;
}

/* ================= LIGHT ================= */

.light{
    position:absolute;
    width:800px;
    height:800px;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-53%);
    background:radial-gradient(
        circle,
        rgba(80,255,160,.12),
        rgba(20,150,80,.05) 35%,
        transparent 68%
    );
    pointer-events:none;
}

.light-ring{
    position:absolute;
    width:850px;
    height:850px;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-53%);
    border:1px solid rgba(255,214,91,.06);
    box-shadow:
        0 0 100px rgba(255,194,52,.05),
        inset 0 0 100px rgba(0,0,0,.3);
}

/* ================= TITLE ================= */

.title{
    position:relative;
    z-index:5;
    text-align:center;
    margin-bottom:18px;
}

.title small{
    color:var(--gold);
    font-size:10px;
    letter-spacing:6px;
    font-weight:700;
    opacity:.8;
}

.title h1{
    margin-top:4px;
    font-family:'Playfair Display',serif;
    font-size:clamp(34px,5vw,65px);
    line-height:1;
    letter-spacing:5px;
    text-shadow:
        0 3px 20px rgba(0,0,0,.8),
        0 0 30px rgba(255,204,73,.12);
}

.title h1 span{
    color:var(--gold);
}

/* ================= TABLE ================= */

.table{
    width:min(900px,90vw);
    height:570px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:1400px;
}

.table-surface{
    position:absolute;
    width:100%;
    height:78%;
    top:12%;
    border-radius:50%;
    background:
        radial-gradient(ellipse at center,#0b6b3c 0%,#07562f 42%,#04351f 72%,#021d11 100%);
    border:12px solid #8d5917;
    box-shadow:
        0 35px 70px rgba(0,0,0,.65),
        inset 0 0 0 3px #e1ad3d,
        inset 0 0 60px rgba(0,0,0,.65),
        0 0 60px rgba(4,0,0,.4);
}

.table-surface:before{
    content:"";
    position:absolute;
    inset:18px;
    border-radius:50%;
    border:2px solid rgba(255,218,110,.18);
}

.table-surface:after{
    content:"";
    position:absolute;
    inset:45px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.06);
}

.ornament{
    position:absolute;
    z-index:1;
    color:rgba(255,218,110,.13);
    font-family:serif;
    font-size:30px;
}

.ornament.a{top:28%;left:14%}
.ornament.b{top:28%;right:14%}
.ornament.c{bottom:26%;left:19%}
.ornament.d{bottom:26%;right:19%}

/* ================= PLATE ================= */

.plate{
    position:absolute;
    width:480px;
    height:230px;
    border-radius:50%;
    top:51%;
    left:50%;
    transform:translate(-50%,-50%) rotateX(52deg);
    transform-style:preserve-3d;
    background:
        radial-gradient(ellipse at center,
            #16251d 0%,
            #07160f 54%,
            #010604 75%);
    border:8px solid #c88a20;
    box-shadow:
        0 25px 35px rgba(0,0,0,.65),
        inset 0 0 0 4px #f5cc62,
        inset 0 0 35px #000,
        0 0 30px rgba(255,192,52,.15);
    z-index:5;
}

.plate:before{
    content:"";
    position:absolute;
    inset:15px;
    border-radius:50%;
    border:3px solid rgba(255,220,111,.45);
}

.plate:after{
    content:"";
    position:absolute;
    inset:32px;
    border-radius:50%;
    border:1px solid rgba(255,220,111,.16);
}

/* ================= DICE AREA ================= */

.dice-area{
    position:absolute;
    z-index:10;
    top:48%;
    left:50%;
    transform:translate(-50%,-50%);
    width:300px;
    height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    perspective:900px;
}

.dice{
    width:76px;
    height:76px;
    position:relative;
    border-radius:15px;
    background:
        linear-gradient(145deg,#fff,#e7e7e7 45%,#a9a9a9);
    box-shadow:
        0 15px 18px rgba(0,0,0,.55),
        inset 3px 3px 7px rgba(255,255,255,.9),
        inset -4px -5px 9px rgba(0,0,0,.25);
    transform-style:preserve-3d;
    transition:transform .3s;
}

.dice:before{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:11px;
    border:1px solid rgba(0,0,0,.08);
}

.pip{
    position:absolute;
    width:13px;
    height:13px;
    border-radius:50%;
    background:#141414;
    box-shadow:inset 2px 2px 3px rgba(255,255,255,.1);
}

.p1{top:11px;left:11px}
.p2{top:11px;left:50%;transform:translateX(-50%)}
.p3{top:11px;right:11px}
.p4{top:50%;left:11px;transform:translateY(-50%)}
.p5{top:50%;left:50%;transform:translate(-50%,-50%)}
.p6{top:50%;right:11px;transform:translateY(-50%)}
.p7{bottom:11px;left:11px}
.p8{bottom:11px;left:50%;transform:translateX(-50%)}
.p9{bottom:11px;right:11px}

.dice.rolling{
    animation:diceSpin .8s cubic-bezier(.2,.8,.3,1) infinite;
}

@keyframes diceSpin{
    0%{transform:translateY(0) rotate(0deg)}
    25%{transform:translateY(-25px) rotate(95deg)}
    50%{transform:translateY(8px) rotate(190deg)}
    75%{transform:translateY(-17px) rotate(280deg)}
    100%{transform:translateY(0) rotate(360deg)}
}

/* ================= BOWL ================= */

.bowl-wrap{
    position:absolute;
    width:430px;
    height:300px;
    top:47%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:20;
    transition:
        top .7s cubic-bezier(.2,.8,.25,1),
        transform .7s cubic-bezier(.2,.8,.25,1),
        opacity .4s;
}

.bowl{
    position:absolute;
    width:430px;
    height:265px;
    left:0;
    top:15px;
    border-radius:50%;
    transform:rotateX(58deg);
    transform-style:preserve-3d;
    background:
        radial-gradient(
            ellipse at 34% 20%,
            #fff0a0 0%,
            #d9a62d 12%,
            #8a5012 35%,
            #4b270b 64%,
            #1d0e04 100%
        );
    border:8px solid #d59c2c;
    box-shadow:
        0 35px 35px rgba(0,0,0,.7),
        inset 0 8px 8px rgba(255,255,255,.35),
        inset 0 -25px 30px rgba(0,0,0,.7),
        0 0 35px rgba(255,190,52,.14);
}

.bowl:before{
    content:"";
    position:absolute;
    inset:17px;
    border-radius:50%;
    border:5px solid rgba(255,226,112,.65);
    box-shadow:
        inset 0 0 15px rgba(0,0,0,.7);
}

.bowl:after{
    content:"";
    position:absolute;
    width:170px;
    height:75px;
    top:22px;
    left:105px;
    border-radius:50%;
    background:linear-gradient(
        130deg,
        rgba(255,255,255,.55),
        rgba(255,255,255,0) 70%
    );
    filter:blur(3px);
    transform:rotate(-15deg);
}

.bowl-symbol{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-family:'Playfair Display',serif;
    font-size:70px;
    color:rgba(255,226,118,.85);
    text-shadow:
        0 3px 3px #311601,
        0 0 15px rgba(255,216,91,.25);
}

.bowl-handle{
    position:absolute;
    width:125px;
    height:35px;
    left:50%;
    top:-8px;
    transform:translateX(-50%) rotateX(60deg);
    border-radius:50%;
    background:linear-gradient(#e6b13d,#77430d);
    border:4px solid #e8bb51;
    box-shadow:0 5px 8px #000;
}

.bowl.open{
    top:23%;
    transform:translate(-50%,-50%) scale(.93);
}

.bowl.shaking{
    animation:bowlShake .11s infinite alternate;
}

@keyframes bowlShake{
    0%{transform:translateX(-50%) rotateX(58deg) translateX(-5px) rotateZ(-1deg)}
    50%{transform:translateX(-50%) rotateX(58deg) translateX(5px) rotateZ(1deg)}
    100%{transform:translateX(-50%) rotateX(58deg) translateX(-3px) rotateZ(-.5deg)}
}

/* ================= STATUS ================= */

.status{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:30;
    min-width:260px;
    padding:10px 22px;
    text-align:center;
    border:1px solid rgba(255,218,109,.25);
    border-radius:50px;
    background:rgba(0,0,0,.32);
    backdrop-filter:blur(10px);
    color:rgba(255,255,255,.65);
    font-size:12px;
    letter-spacing:2px;
}

.status.active{
    color:#ffd96b;
    border-color:rgba(255,215,106,.6);
    box-shadow:0 0 25px rgba(255,198,59,.12);
}

/* ================= RESULT ================= */

.result{
    position:absolute;
    z-index:35;
    left:50%;
    top:72%;
    transform:translate(-50%,-50%) scale(.5);
    opacity:0;
    text-align:center;
    pointer-events:none;
    transition:.5s cubic-bezier(.2,1.4,.4,1);
}

.result.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

.result-label{
    font-size:12px;
    letter-spacing:5px;
    opacity:.65;
}

.result-word{
    margin-top:3px;
    font-family:'Playfair Display',serif;
    font-size:72px;
    font-weight:800;
    line-height:1;
    text-shadow:0 0 30px currentColor;
}

.result-word.tai{
    color:#ff4646;
}

.result-word.xiu{
    color:#4ba8ff;
}

.result-total{
    margin-top:7px;
    font-size:14px;
    font-weight:700;
    letter-spacing:3px;
}

/* ================= BUTTON ================= */

.control{
    position:relative;
    z-index:40;
    margin-top:-2px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
}

.roll-btn{
    position:relative;
    width:280px;
    height:65px;
    border:none;
    border-radius:18px;
    cursor:pointer;
    overflow:hidden;
    color:#321c00;
    font-size:15px;
    font-weight:900;
    letter-spacing:2px;
    background:
        linear-gradient(
            110deg,
            #a96d15,
            #ffe276 25%,
            #fff2a2 50%,
            #e7ad31 75%,
            #8c5310
        );
    box-shadow:
        0 13px 30px rgba(0,0,0,.55),
        0 0 30px rgba(255,202,64,.14),
        inset 0 2px 2px rgba(255,255,255,.7),
        inset 0 -5px 8px rgba(98,51,0,.35);
    transition:.2s;
}

.roll-btn:before{
    content:"";
    position:absolute;
    width:80px;
    height:150%;
    top:-25%;
    left:-100px;
    transform:rotate(20deg);
    background:rgba(255,255,255,.5);
    filter:blur(8px);
    transition:.6s;
}

.roll-btn:hover:before{
    left:120%;
}

.roll-btn:hover{
    transform:translateY(-3px);
    box-shadow:
        0 18px 35px rgba(0,0,0,.6),
        0 0 35px rgba(255,202,64,.25);
}

.roll-btn:active{
    transform:translateY(2px);
}

.roll-btn:disabled{
    cursor:not-allowed;
    filter:grayscale(.35);
    opacity:.65;
}

.hint{
    font-size:10px;
    opacity:.35;
    letter-spacing:2px;
}

/* ================= SIDE PANELS ================= */

.panel{
    position:absolute;
    z-index:45;
    width:210px;
    border:1px solid rgba(255,215,106,.15);
    border-radius:18px;
    background:rgba(0,0,0,.24);
    backdrop-filter:blur(15px);
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.panel-title{
    padding:14px 15px 10px;
    color:#ffd86b;
    font-size:10px;
    font-weight:800;
    letter-spacing:3px;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.stats{
    left:20px;
    top:160px;
}

.stat{
    padding:12px 15px;
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,.04);
}

.stat:last-child{
    border-bottom:0;
}

.stat span:first-child{
    font-size:10px;
    opacity:.45;
}

.stat span:last-child{
    font-size:12px;
    font-weight:800;
}

/* ================= HISTORY ================= */

.history{
    right:20px;
    top:160px;
    max-height:390px;
    overflow:hidden;
}

.history-list{
    max-height:325px;
    overflow-y:auto;
    scrollbar-width:thin;
}

.history-item{
    padding:10px 13px;
    display:grid;
    grid-template-columns:30px 1fr auto;
    align-items:center;
    gap:7px;
    border-bottom:1px solid rgba(255,255,255,.04);
}

.history-number{
    font-size:9px;
    opacity:.3;
}

.history-dice{
    font-size:10px;
    opacity:.65;
}

.history-result{
    font-size:11px;
    font-weight:900;
}

.history-result.tai{
    color:#ff5050;
}

.history-result.xiu{
    color:#53aaff;
}

/* ================= PARTICLES ================= */

.particle{
    position:fixed;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#ffd86a;
    pointer-events:none;
    z-index:100;
    box-shadow:0 0 10px #ffd86a;
    animation:particleFly .9s ease-out forwards;
}

@keyframes particleFly{
    to{
        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(0);
        opacity:0;
    }
}

/* ================= FLASH ================= */

.flash{
    position:fixed;
    inset:0;
    z-index:90;
    pointer-events:none;
    background:radial-gradient(circle at center,rgba(255,216,101,.35),transparent 45%);
    opacity:0;
}

.flash.go{
    animation:flash .5s ease-out;
}

@keyframes flash{
    0%{opacity:0}
    30%{opacity:1}
    100%{opacity:0}
}

/* ================= AUTO ================= */

.auto{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    z-index:60;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 13px;
    border-radius:30px;
    background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
    font-size:10px;
    opacity:.75;
}

.switch{
    width:35px;
    height:19px;
    padding:2px;
    border-radius:20px;
    background:#333;
    cursor:pointer;
    transition:.25s;
}

.switch i{
    display:block;
    width:15px;
    height:15px;
    border-radius:50%;
    background:#aaa;
    transition:.25s;
}

.switch.on{
    background:#a9781c;
}

.switch.on i{
    transform:translateX(16px);
    background:#ffe47b;
}

/* ================= MOBILE ================= */

@media(max-width:1000px){
    .panel{
        display:none;
    }

    .table{
        width:100vw;
        height:530px;
    }

    .table-surface{
        width:110%;
    }

    .title{
        margin-top:15px;
    }
}

@media(max-width:600px){
    .topbar{
        height:65px;
        padding:0 15px;
    }

    .main{
        padding-top:65px;
    }

    .logo-text span{
        display:none;
    }

    .top-btn{
        padding:0 10px;
        font-size:11px;
    }

    .casino{
        padding-top:20px;
    }

    .title h1{
        font-size:38px;
        letter-spacing:3px;
    }

    .title small{
        font-size:8px;
        letter-spacing:4px;
    }

    .table{
        height:470px;
        width:100vw;
    }

    .table-surface{
        height:65%;
        width:125%;
        border-width:8px;
    }

    .plate{
        width:340px;
        height:165px;
    }

    .bowl-wrap{
        width:320px;
        height:230px;
    }

    .bowl{
        width:320px;
        height:205px;
    }

    .bowl-symbol{
        font-size:55px;
    }

    .bowl-handle{
        width:100px;
    }

    .dice-area{
        width:230px;
        gap:8px;
    }

    .dice{
        width:62px;
        height:62px;
    }

    .pip{
        width:10px;
        height:10px;
    }

    .p1,.p2,.p3{top:9px}
    .p1,.p4,.p7{left:9px}
    .p3,.p6,.p9{right:9px}
    .p7,.p8,.p9{bottom:9px}

    .result{
        top:72%;
    }

    .result-word{
        font-size:56px;
    }

    .roll-btn{
        width:250px;
        height:60px;
    }

    .status{
        top:8px;
        min-width:220px;
    }

    .auto{
        bottom:10px;
    }
}
</style>
</head>

<body>

<div class="flash" id="flash"></div>

<header class="topbar">
    <div class="logo">
        <div class="logo-mark">🎲</div>
        <div class="logo-text">
            <strong>TÀI XỈU</strong>
            <span>CASINO TABLE</span>
        </div>
    </div>

    <div class="top-actions">
        <button class="top-btn" id="soundBtn">🔊 Âm thanh</button>
        <button class="top-btn" id="clearBtn">↻ Reset</button>
    </div>
</header>

<main class="main">

    <section class="casino">

        <div class="light"></div>
        <div class="light-ring"></div>

        <div class="title">
            <small>WELCOME TO THE TABLE</small>
            <h1>TÀI <span>•</span> XỈU</h1>
        </div>

        <div class="panel stats">
            <div class="panel-title">THỐNG KÊ</div>

            <div class="stat">
                <span>Phiên</span>
                <span id="roundCount">0</span>
            </div>

            <div class="stat">
                <span>Tài</span>
                <span id="taiCount">0</span>
            </div>

            <div class="stat">
                <span>Xỉu</span>
                <span id="xiuCount">0</span>
            </div>

            <div class="stat">
                <span>Tổng gần nhất</span>
                <span id="lastTotal">--</span>
            </div>
        </div>

        <div class="panel history">
            <div class="panel-title">LỊCH SỬ</div>
            <div class="history-list" id="historyList">
                <div style="padding:18px;text-align:center;font-size:10px;opacity:.3">
                    Chưa có kết quả
                </div>
            </div>
        </div>

        <div class="table">

            <div class="table-surface">
                <div class="ornament a">✦</div>
                <div class="ornament b">✦</div>
                <div class="ornament c">✦</div>
                <div class="ornament d">✦</div>
            </div>

            <div class="status" id="status">
                SẴN SÀNG MỞ BÁT
            </div>

            <div class="plate"></div>

            <div class="dice-area" id="diceArea"></div>

            <div class="bowl-wrap" id="bowlWrap">
                <div class="bowl" id="bowl">
                    <div class="bowl-symbol">大</div>
                    <div class="bowl-handle"></div>
                </div>
            </div>

            <div class="result" id="result">
                <div class="result-label">KẾT QUẢ</div>
                <div class="result-word" id="resultWord">TÀI</div>
                <div class="result-total" id="resultTotal">TỔNG 12</div>
            </div>

        </div>

        <div class="control">
            <button class="roll-btn" id="rollBtn">
                🎲 MỞ BÁT XEM KẾT QUẢ
            </button>

            <div class="hint">
                CLICK ĐỂ BẮT ĐẦU PHIÊN MỚI
            </div>
        </div>

    </section>
</main>

<div class="auto">
    <span>AUTO</span>
    <div class="switch" id="autoSwitch">
        <i></i>
    </div>
</div>

<script>
/* ================= DATA ================= */

const rollBtn = document.getElementById("rollBtn");
const bowl = document.getElementById("bowl");
const bowlWrap = document.getElementById("bowlWrap");
const diceArea = document.getElementById("diceArea");
const result = document.getElementById("result");
const resultWord = document.getElementById("resultWord");
const resultTotal = document.getElementById("resultTotal");
const status = document.getElementById("status");
const historyList = document.getElementById("historyList");
const flash = document.getElementById("flash");

const roundCount = document.getElementById("roundCount");
const taiCount = document.getElementById("taiCount");
const xiuCount = document.getElementById("xiuCount");
const lastTotal = document.getElementById("lastTotal");

let rolling = false;
let soundEnabled = true;
let autoMode = false;
let autoTimer = null;

let history = JSON.parse(
    localStorage.getItem("taixiu_history") || "[]"
);

/* ================= DICE ================= */

function makeDice(value){

    const dice = document.createElement("div");
    dice.className = "dice";

    const layouts = {
        1:[5],
        2:[1,9],
        3:[1,5,9],
        4:[1,3,7,9],
        5:[1,3,5,7,9],
        6:[1,3,4,6,7,9]
    };

    layouts[value].forEach(pos=>{
        const pip = document.createElement("span");
        pip.className = "pip p"+pos;
        dice.appendChild(pip);
    });

    dice.dataset.value = value;

    return dice;
}

function showDice(values){

    diceArea.innerHTML = "";

    values.forEach(value=>{
        diceArea.appendChild(makeDice(value));
    });
}

/* ================= RANDOM ================= */

function randomDice(){

    return [
        Math.floor(Math.random()*6)+1,
        Math.floor(Math.random()*6)+1,
        Math.floor(Math.random()*6)+1
    ];
}

/* ================= SOUND ================= */

let audioCtx = null;

function initAudio(){

    if(!soundEnabled) return;

    if(!audioCtx){
        audioCtx = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if(audioCtx.state === "suspended"){
        audioCtx.resume();
    }
}

function tone(freq,duration,type="sine",volume=.04){

    if(!soundEnabled) return;

    initAudio();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(volume,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime+duration);
}

function shakeSound(){

    tone(90,.08,"square",.025);

    setTimeout(()=>{
        tone(70,.08,"square",.02);
    },70);
}

function resultSound(){

    tone(420,.15,"sine",.05);

    setTimeout(()=>{
        tone(620,.2,"sine",.04);
    },100);

    setTimeout(()=>{
        tone(880,.3,"sine",.035);
    },210);
}

/* ================= PARTICLES ================= */

function createParticles(){

    const centerX = window.innerWidth/2;
    const centerY = window.innerHeight*.55;

    for(let i=0;i<45;i++){

        const p = document.createElement("div");

        p.className = "particle";

        p.style.left = centerX+"px";
        p.style.top = centerY+"px";

        const angle = Math.random()*Math.PI*2;
        const distance = 80 + Math.random()*240;

        p.style.setProperty(
            "--x",
            Math.cos(angle)*distance+"px"
        );

        p.style.setProperty(
            "--y",
            Math.sin(angle)*distance+"px"
        );

        p.style.width =
        p.style.height =
            (2+Math.random()*5)+"px";

        document.body.appendChild(p);

        setTimeout(()=>{
            p.remove();
        },1000);
    }
}

/* ================= HISTORY ================= */

function saveHistory(data){

    history.unshift(data);

    if(history.length > 100){
        history = history.slice(0,100);
    }

    localStorage.setItem(
        "taixiu_history",
        JSON.stringify(history)
    );
}

function renderHistory(){

    if(!history.length){

        historyList.innerHTML = `
            <div style="
                padding:18px;
                text-align:center;
                font-size:10px;
                opacity:.3
            ">
                Chưa có kết quả
            </div>
        `;

        return;
    }

    historyList.innerHTML = history
        .slice(0,20)
        .map((item,index)=>{

            const cls =
                item.type === "TÀI"
                ? "tai"
                : "xiu";

            return `
                <div class="history-item">

                    <div class="history-number">
                        #${history.length-index}
                    </div>

                    <div class="history-dice">
                        ${item.dice.join(" • ")}
                    </div>

                    <div class="history-result ${cls}">
                        ${item.type} ${item.total}
                    </div>

                </div>
            `;

        })
        .join("");
}

function updateStats(){

    const tai = history.filter(
        x=>x.type==="TÀI"
    ).length;

    const xiu = history.filter(
        x=>x.type==="XỈU"
    ).length;

    roundCount.textContent = history.length;
    taiCount.textContent = tai;
    xiuCount.textContent = xiu;

    lastTotal.textContent =
        history.length
        ? history[0].total
        : "--";
}

/* ================= RESULT ================= */

function displayResult(values){

    const total =
        values[0]+values[1]+values[2];

    const type =
        total >= 11
        ? "TÀI"
        : "XỈU";

    resultWord.textContent = type;

    resultWord.className =
        "result-word "+
        (type==="TÀI" ? "tai":"xiu");

    resultTotal.textContent =
        `TỔNG ${total}  •  ${values.join(" - ")}`;

    result.classList.add("show");

    createParticles();
    flash.classList.add("go");

    resultSound();

    setTimeout(()=>{
        flash.classList.remove("go");
    },500);

    saveHistory({
        dice:values,
        total:total,
        type:type,
        time:Date.now()
    });

    renderHistory();
    updateStats();
}

/* ================= MAIN ROLL ================= */

async function roll(){

    if(rolling) return;

    rolling = true;
    rollBtn.disabled = true;

    initAudio();

    result.classList.remove("show");

    status.classList.add("active");
    status.textContent = "ĐANG CHUẨN BỊ MỞ BÁT...";

    /* random trước */

    const values = randomDice();

    showDice(values);

    const dice =
        [...document.querySelectorAll(".dice")];

    dice.forEach(d=>{
        d.classList.add("rolling");
    });

    /* bowl hạ xuống */

    bowl.classList.remove("open");

    await wait(500);

    status.textContent =
        "BÁT ĐANG ĐƯỢC ÚP XUỐNG...";

    tone(110,.15,"triangle",.03);

    await wait(550);

    /* shaking */

    status.textContent =
        "ĐANG XÓC XÚC XẮC...";

    bowl.classList.add("shaking");

    for(let i=0;i<13;i++){

        shakeSound();

        await wait(110);
    }

    bowl.classList.remove("shaking");

    dice.forEach(d=>{
        d.classList.remove("rolling");
    });

    await wait(350);

    /* open */

    status.textContent =
        "MỞ BÁT!";

    bowl.classList.add("open");

    await wait(650);

    displayResult(values);

    await wait(1800);

    status.textContent =
        "KẾT QUẢ ĐÃ ĐƯỢC GHI NHẬN";

    await wait(900);

    bowl.classList.remove("open");

    result.classList.remove("show");

    await wait(500);

    status.textContent =
        "SẴN SÀNG MỞ BÁT";

    rollBtn.disabled = false;
    rolling = false;

    if(autoMode){

        autoTimer = setTimeout(()=>{
            roll();
        },1800);
    }
}

function wait(ms){
    return new Promise(resolve=>{
        setTimeout(resolve,ms);
    });
}

/* ================= EVENTS ================= */

rollBtn.addEventListener("click",roll);

document.getElementById("soundBtn")
.addEventListener("click",()=>{

    soundEnabled = !soundEnabled;

    document.getElementById("soundBtn")
        .textContent =
        soundEnabled
        ? "🔊 Âm thanh"
        : "🔇 Tắt tiếng";

    if(soundEnabled){
        initAudio();
        tone(500,.1);
    }
});

document.getElementById("clearBtn")
.addEventListener("click",()=>{

    if(rolling) return;

    if(confirm("Xóa toàn bộ lịch sử?")){

        history = [];

        localStorage.removeItem(
            "taixiu_history"
        );

        renderHistory();
        updateStats();
    }
});

document.getElementById("autoSwitch")
.addEventListener("click",function(){

    autoMode = !autoMode;

    this.classList.toggle(
        "on",
        autoMode
    );

    if(autoMode && !rolling){
        roll();
    }

    if(!autoMode && autoTimer){
        clearTimeout(autoTimer);
        autoTimer = null;
    }
});

/* ================= INIT ================= */

showDice([1,2,3]);
renderHistory();
updateStats();

/* Unlock audio */

document.addEventListener(
    "pointerdown",
    ()=>{
        if(soundEnabled){
            initAudio();
        }
    },
    {once:true}
);
</script>

</body>
</html>
